name: Fetch URLs from web.txt

on:
  push:
    branches:
      - "**"
    # 避免自己提交 out*/ 结果时再次触发，形成死循环
    paths-ignore:
      - "out*/**"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch all URLs into out${time}/LineN.out
        run: |
          set -euo pipefail

          if [ ! -f web.txt ]; then
            echo "::error::web.txt 不存在"
            exit 1
          fi

          TIME=$(date -u +%Y%m%d%H%M%S)
          OUTDIR="out${TIME}"
          mkdir -p "$OUTDIR"
          echo "OUTDIR=$OUTDIR" >> "$GITHUB_ENV"
          echo "输出目录: $OUTDIR"

          idx=0
          while IFS= read -r line || [ -n "$line" ]; do
            # 去掉行尾 \r 和首尾空白
            url=$(printf '%s' "$line" \
                  | tr -d '\r' \
                  | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')

            # 跳过空行和以 # 开头的注释行
            [ -z "$url" ] && continue
            case "$url" in \#*) continue ;; esac

            idx=$((idx + 1))
            out="${OUTDIR}/Line${idx}.out"
            echo "[$idx] $url -> $out"

            if ! curl -sSL --fail --retry 3 --max-time 60 "$url" -o "$out"; then
              # 抓取失败也写一个占位文件，保证行号顺序不断档
              printf 'ERROR: failed to fetch %s\n' "$url" > "$out"
              echo "::warning::抓取失败: $url"
            fi
          done < web.txt

          echo "共处理 $idx 个 URL"

      - name: Commit results
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -d "$OUTDIR" ] || [ -z "$(ls -A "$OUTDIR")" ]; then
            echo "没有生成任何文件，跳过提交"
            exit 0
          fi

          git add "$OUTDIR"
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: add ${OUTDIR} [skip ci]"
            git push
          fi